<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ishan Ganti</title>
    <meta
      name="description"
      content="Ishan Ganti — student interested in math, coding, cubing, books, and nature."
    />
    <meta property="og:title" content="Ishan Ganti" />
    <meta
      property="og:description"
      content="Ishan Ganti — student interested in math, coding, cubing, books, and nature."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon.png"
    />
    <link
      rel="apple-touch-icon"
      href="%BASE_URL%logo.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ig-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F6FAF7] text-emerald-950 dark:bg-[#06110D] dark:text-emerald-50 antialiased selection:bg-emerald-500/25 selection:text-emerald-800 dark:selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
